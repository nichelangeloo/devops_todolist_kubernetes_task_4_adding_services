apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    app: todolist
spec:
  containers:
  - name: todoapp
    image: nichelangeloo/todoapp:3.0.0
    env:
      - name: ENGINE
        value: "mysql.connector.django"
      - name: HOST
        value: "mysql"
      - name: NAME
        value: "app_db"
      - name: USER
        value: "app_user"
      - name: PASSWORD
        value: "1234"
      - name: PORT
        value: "3306"
    ports:
    - containerPort: 8080
    livenessProbe:
      httpGet:
        path: api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: api/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5

